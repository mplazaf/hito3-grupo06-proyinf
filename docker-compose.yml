services:
  api_ejemplo:
    build: ./API_EJEMPLO
    env_file: ./API_EJEMPLO/.env
    ports:
      - "8082:8082"
    depends_on:
      - mysql
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mysql:
    image: mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: BD_EJEMPLO
    ports:
      - "3306:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql


  api_tramitacion:
    build: ./API_TRAMITACION
    env_file: ./API_TRAMITACION/.env
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    extra_hosts:
      - "host.docker.internal:host-gateway"

  api_validaciones:
    build: ./API_VALIDACIONES
    env_file: ./API_VALIDACIONES/.env
    ports:
      - "8081:8081"
    depends_on:
      - mysql
    extra_hosts:
      - "host.docker.internal:host-gateway"
